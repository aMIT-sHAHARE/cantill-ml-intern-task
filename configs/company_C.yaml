# Company C: invoice lines + category_tree_C
name: company_C
data_dir: data/company_C
reporting_currency: USD
default_vat_rate: 0.0
valid_years: [2000, 2100]
taxonomy:
  file: category_tree_C (4).csv
approved_statuses: [approved, paid]
matching:
  enabled: true
  po_regex: '45\d{8}'
  amount_tolerance: 0.01
sources:
  - name: lines
    role: primary
    file: invoice_lines (4).csv
    id_prefix: "INV:"
    amount_basis: net
    currency_fixed: USD
    columns:
      record_id: line_id
      date: invoice_date
      supplier_name: supplier_name
      description: [line_description, product_service_description, invoice_description]
      context: [gl_account_description, buyer_entity, submission_type]
      amount: line_amount_usd
      quantity: quantity
      invoice_number: invoice_number
      status: status
      item_code: product_service_code